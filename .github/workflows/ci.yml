name: quality

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - run: uv run ruff check .
      - run: uv run mypy packages/docalign_core apps/api
      - run: uv run pytest
      - run: uv run python scripts/export_schemas.py --check
      - run: uv run python -m scripts.export_openapi --check
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm --filter @docalign/web exec playwright install chromium
      - run: pnpm e2e

  ubuntu-core-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy packages/docalign_core apps/api
      - run: uv run pytest tests/unit tests/integration
