name: distribution

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: uv run python -m scripts.build_distribution
      - name: Smoke-test macOS bundle
        if: runner.os == 'macOS'
        run: >-
          uv run python -m scripts.smoke_distribution
          --launcher dist/distribution/DocAlign.app/Contents/MacOS/DocAlign
      - name: Smoke-test Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          uv run python -m scripts.smoke_distribution
          --launcher dist/distribution/DocAlign/DocAlign.exe
      - name: Archive macOS bundle
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            dist/distribution/DocAlign.app \
            "artifacts/DocAlign-${RUNNER_OS}-${RUNNER_ARCH}.zip"
      - name: Archive Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive \
            -Path dist/distribution/DocAlign \
            -DestinationPath "artifacts/DocAlign-$env:RUNNER_OS-$env:RUNNER_ARCH.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: DocAlign-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14
